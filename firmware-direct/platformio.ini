; Code by Grey and his buddy Claude.
;
; Cheap Yellow Display (ESP32-2432S028R) build. TFT_eSPI panel config below
; matches TouchWifiProvisioner's CYD examples exactly (same board, same
; wiring) - see that repo's User_Setup.h for the reference values these
; were copied from. Sources live in src/ (PlatformIO's default), unlike
; TouchWifiProvisioner's own examples which use a root .ino for Arduino
; IDE's "File > Examples" convention - this project isn't a library, so
; that constraint doesn't apply here.
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
; TouchWifiProvisioner isn't cloned locally - pulled straight from its repo,
; same as its own README documents for PlatformIO consumers.
lib_deps =
	WiFi
	WebServer
	ESPmDNS
	ArduinoOTA
	Update
	https://github.com/Grey-Lancaster/TouchWifiProvisioner.git
	bodmer/TFT_eSPI@^2.5.33
	paulstoffregen/XPT2046_Touchscreen
	lvgl/lvgl@^8.3.11
	bblanchon/ArduinoJson@^6.21.4
; Same version TouchWifiProvisioner's own CYD_RollingClock example pins -
; if the build errors with "conflicting declaration of 'time_t'", this
; toolchain resolved picolibc instead of newlib; see that example's
; README for the -D__time_t_defined build flag fix. Not needed so far in
; this project (Iso8601.cpp's own mktime() usage compiles clean here).
	ropg/ezTime@^0.8.3
; ../common (UsageDashboard, Iso8601) lives one level up, as a sibling of
; this folder within the same repo. Referenced directly rather than via
; lib_extra_dirs = .. - that pointed PlatformIO at the whole repo root,
; which also contains this project's own folder (and firmware-relay,
; relay-server), and it started treating those as extra libraries too
; instead of just picking up common/. symlink:// references exactly the
; one folder we mean, live (no copy into .pio/libdeps).
	symlink://../common
board_build.partitions = min_spiffs.csv
build_flags =
	-I include
	-DUSER_SETUP_LOADED
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DUSE_HSPI_PORT
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DLV_CONF_INCLUDE_SIMPLE
	-DST7789_DRIVER
	-DTFT_INVERSION_OFF
; Neither TFT_RGB_ORDER nor CGRAM_OFFSET was set anywhere, so TFT_eSPI's
; ST7789 driver defaulted to RGB colour order - wrong for this panel, which
; showed the mascot badge's orange (0xE0795A) rendering as a blue-purple
; (0x5A79E0, its R/B-swapped counterpart). This flag is a standard TFT_eSPI
; override for exactly that panel-wiring variant (other boards in
; TFT_eSPI's own reference Setups need the same override for their ST7789
; panels) - fixes every colour on screen, not just the mascot.
	-DTFT_RGB_ORDER=TFT_BGR

; Update over Wi-Fi instead of USB, once the device is already on your
; network: `pio run -e cyd_ota -t upload`. First flash still has to be
; over USB (env:cyd) - there's no OTA path onto a device that isn't
; running this firmware yet. CHANGE the --auth password below before
; relying on this; "changeme" left as-is means anyone on your LAN who
; finds the device via mDNS can push firmware to it.
[env:cyd_ota]
extends = env:cyd
build_flags =
	${env:cyd.build_flags}
	-DOTA_PASSWORD=\"changeme\"
upload_protocol = espota
upload_port = claudeusage.local
upload_flags =
	--auth=changeme
